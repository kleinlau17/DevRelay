name: Test and install

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=68' wheel
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: git diff --check
      - name: Build distributable
        run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - name: Installed user flow
        run: python scripts/smoke_install.py dist/devrelay-*.whl
