[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devrelay"
version = "0.4.0"
description = "Agent-driven engineering tools with verified delivery gates and optional Codex orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devrelay = "devrelay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
